name: Actualizar partidos de Cumbres Cancún

on:
  schedule:
    # Cada 30 min, de 7:00 am a 11:59 pm hora de Puebla (13:00–05:59 UTC), del 16 al 25 de noviembre.
    # Cada corrida revisa Tagers cada 5 minutos durante ~55 minutos, así se cubren los huecos.
    - cron: '7,37 13-23 16-24 11 *'
    - cron: '7,37 0-5 17-25 11 *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/actualizar.mjs'
      - '.github/workflows/actualizar.yml'
      - 'despertar.txt'
      - 'scripts/rosters.mjs'

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null && npm i playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Revisar Tagers cada 5 minutos
        run: |
          git config user.name "robot-cumbres"
          git config user.email "actions@users.noreply.github.com"
          fin=$(( $(date +%s) + 55*60 ))
          ultimo_push=0
          vuelta=0
          while :; do
            git pull -q --rebase origin main || true
            antes=$(node -e "const d=require('./data.json');console.log(JSON.stringify([d.matches,d.standings]))" 2>/dev/null || echo "")
            # Rosters de zione cada 15 minutos (una de cada 3 vueltas)
            if [ $(( vuelta % 3 )) -eq 0 ]; then
              node scripts/rosters.mjs || echo "rosters: sin cambios por error"
              git add roster.json 2>/dev/null
              if ! git diff --cached --quiet; then
                git commit -q -m "Robot: actualiza rosters"
                for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
              fi
            fi
            vuelta=$(( vuelta + 1 ))
            if node scripts/actualizar.mjs; then
              despues=$(node -e "const d=require('./data.json');console.log(JSON.stringify([d.matches,d.standings]))")
              ahora=$(date +%s)
              if [ "$antes" != "$despues" ] || [ $(( ahora - ultimo_push )) -ge 1200 ]; then
                git add data.json
                if ! git diff --cached --quiet; then
                  git commit -q -m "Robot: actualiza partidos y tablas"
                  for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
                  ultimo_push=$ahora
                fi
              else
                git checkout -- data.json
              fi
            fi
            [ $(( $(date +%s) + 300 )) -ge $fin ] && break
            sleep 300
          done
      - name: Relanzarse para la siguiente hora
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se vuelve a lanzar sin parar mientras dura el torneo (repo público: los minutos son gratis).
          dia=$(TZ=America/Mexico_City date +%Y%m%d)
          if [ "$dia" -le 20261124 ]; then
            gh workflow run actualizar.yml --ref main -R "$GITHUB_REPOSITORY" && echo "relanzado"
          else
            echo "torneo terminado, no se relanza"
          fi
