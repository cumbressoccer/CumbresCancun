name: Prueba detalle de partido zione
on:
  push:
    paths: ['scripts/zprobe.mjs', '.github/workflows/zprobe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y >/dev/null && npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/zprobe.mjs
      - run: |
          git config user.name "robot-cumbres"; git config user.email "actions@users.noreply.github.com"
          git add zcap3; git commit -m "Prueba zione detalle" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
