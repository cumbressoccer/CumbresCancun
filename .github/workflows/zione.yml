name: Descubrir zione (prueba)
on:
  push:
    paths: ['scripts/zione.mjs', '.github/workflows/zione.yml']
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y >/dev/null && npm i playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/zione.mjs
      - run: |
          git config user.name "robot-cumbres"; git config user.email "actions@users.noreply.github.com"
          git add zcap2; git commit -m "Capturas de zione" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
