name: Capturar Tagers (prueba)

on:
  push:
    paths:
      - 'scripts/capture.mjs'
      - '.github/workflows/capturar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null && npm i playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture.mjs
      - name: Guardar capturas
        run: |
          git config user.name "robot-cumbres"
          git config user.email "actions@users.noreply.github.com"
          git add captures
          git commit -m "Capturas de Tagers" || echo "sin cambios"
          git pull --rebase origin main
          git push
